<svg xmlns="http://www.w3.org/2000/svg" width="272" height="270" viewBox="104 0 272 270" role="img" aria-labelledby="title desc">
  <title id="title">BidBento mascot</title>
  <desc id="desc">The BidBento robot floats while scanning for an open category.</desc>
  <defs>
    <linearGradient id="body-border" x1="180" y1="68" x2="300" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset=".52" stop-color="#10b981"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="flame" x1="240" y1="205" x2="240" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset=".55" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#10b981" stop-opacity=".14"/>
      <stop offset="1" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <filter id="coin-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .mascot { transform-box: fill-box; transform-origin: center; animation: float 4s cubic-bezier(.32,.72,0,1) infinite; }
      .eyes { transform-box: fill-box; transform-origin: center; animation: blink 3.5s cubic-bezier(.32,.72,0,1) infinite; }
      .beacon { animation: beacon 1.5s cubic-bezier(.32,.72,0,1) infinite; }
      .flag { transform-box: fill-box; transform-origin: left center; animation: flag 2.5s cubic-bezier(.32,.72,0,1) infinite; }
      .flame { transform-box: fill-box; transform-origin: center top; animation: flame .4s cubic-bezier(.32,.72,0,1) infinite; }
      .orbit { transform-origin: 240px 135px; animation: orbit 16s linear infinite; }
      .orbit-counter { transform-box: fill-box; transform-origin: center; animation: counter-orbit 16s linear infinite; }
      .radar-a { transform-origin: 240px 135px; animation: radar 3s cubic-bezier(.32,.72,0,1) infinite; }
      .radar-b { transform-origin: 240px 135px; animation: radar 3s 1.5s cubic-bezier(.32,.72,0,1) infinite; opacity: 0; }
      .spark { transform-box: fill-box; transform-origin: center; animation: spark 1.5s cubic-bezier(.32,.72,0,1) infinite; }
      @keyframes float { 0%,100% { transform: translateY(-8px) rotate(-2deg); } 50% { transform: translateY(8px) rotate(2deg); } }
      @keyframes blink { 0%,45%,55%,100% { transform: scaleY(1); } 49%,51% { transform: scaleY(.08); } }
      @keyframes beacon { 0%,100% { fill: #8b5cf6; r: 6px; } 50% { fill: #34d399; r: 7.5px; } }
      @keyframes flag { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(7deg); } }
      @keyframes flame { 0%,100% { transform: scaleY(.82); } 50% { transform: scaleY(1.18); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes counter-orbit { to { transform: rotate(-360deg); } }
      @keyframes radar { 0% { transform: scale(.7); opacity: .55; } 100% { transform: scale(1.7); opacity: 0; } }
      @keyframes spark { 0%,100% { opacity: .35; transform: scale(.72) rotate(0); } 50% { opacity: 1; transform: scale(1.08) rotate(90deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>

  <circle cx="240" cy="135" r="126" fill="url(#ambient)"/>
  <circle cx="240" cy="135" r="86" fill="none" stroke="#10b981" stroke-opacity=".18" stroke-width="2"/>
  <circle class="radar-a" cx="240" cy="135" r="66" fill="none" stroke="#10b981" stroke-opacity=".42" stroke-width="2"/>
  <circle class="radar-b" cx="240" cy="135" r="66" fill="none" stroke="#8b5cf6" stroke-opacity=".42" stroke-width="2"/>

  <g class="orbit">
    <g class="orbit-counter">
      <circle cx="195" cy="64" r="13" fill="#f59e0b" opacity=".25" filter="url(#coin-glow)"/>
      <circle cx="195" cy="64" r="8" fill="#fbbf24"/>
      <path d="M198 60h-4a2.5 2.5 0 0 0 0 5h2a2.5 2.5 0 0 1 0 5h-4m3-12v14" fill="none" stroke="#18181b" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <circle cx="148" cy="158" r="5" fill="#a78bfa"/>
    <g class="spark" transform="translate(324 184)" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round">
      <path d="M6 0v12M0 6h12M2 2l8 8M10 2l-8 8"/>
    </g>
  </g>

  <g class="mascot">
    <path class="flame" d="M225 205Q240 242 255 205Q240 220 225 205Z" fill="url(#flame)"/>
    <rect x="217" y="185" width="16" height="26" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="3"/>
    <rect x="247" y="185" width="16" height="26" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="3"/>
    <rect x="184" y="76" width="112" height="112" rx="30" fill="#18181b" stroke="url(#body-border)" stroke-width="5"/>
    <rect x="196" y="88" width="88" height="82" rx="22" fill="#09090b" stroke="#27272a" stroke-width="3"/>
    <g class="eyes">
      <circle cx="217" cy="125" r="9" fill="#10b981"/>
      <circle cx="220" cy="122" r="3" fill="#fff"/>
      <circle cx="263" cy="125" r="9" fill="#10b981"/>
      <circle cx="266" cy="122" r="3" fill="#fff"/>
      <path d="M231 141Q240 150 249 141" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M240 76V58" stroke="#71717a" stroke-width="4" stroke-linecap="round"/>
    <circle class="beacon" cx="240" cy="56" r="6" fill="#8b5cf6"/>
    <g class="flag">
      <path d="M298 125V65" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
      <path d="M298 68L324 81L298 94Z" fill="#10b981"/>
      <circle cx="307" cy="81" r="4" fill="#fff"/>
    </g>
  </g>
</svg>
